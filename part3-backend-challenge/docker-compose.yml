version: '3'

services:
  db:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: swikriti
      POSTGRES_PASSWORD: swikriti
      POSTGRES_DB: payment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: swikriti@gmail.com
      PGADMIN_DEFAULT_PASSWORD: swikriti
    ports:
      - "80:80"
    depends_on:
      - db

volumes:
  postgres_data:
